# Usage de l'IA : fichier écrit avec l'aide de l'IA (Claude), avec l'autorisation de l'enseignant. Voir AI_LOG.md.

# Nom affiché dans l'onglet « Actions » de GitHub.
name: CI

# Quand lancer la CI : à chaque push sur main, et à chaque pull request qui vise main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimum : la CI peut seulement lire le code du dépôt, rien modifier.
permissions:
  contents: read

jobs:
  # Un seul travail, nommé « test », qui tourne sur une machine Linux fournie par GitHub.
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code du dépôt sur la machine.
      #    Action épinglée sur le SHA du commit de la version v4.2.2 (pas sur une étiquette qui peut changer).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Installer Python 3.12. Même principe d'épinglage, version v5.6.0.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 3. Pas de « pip install » : le projet n'utilise que la bibliothèque standard de Python.

      # 4. Lancer tous les tests du dossier tests/. Si un seul test échoue,
      #    la commande renvoie une erreur et la CI devient rouge.
      - name: Lancer les tests
        run: python -m unittest discover -s tests -t . -v
